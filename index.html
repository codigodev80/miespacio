<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Vinculación de manifiesto PWA para descarga nativa -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mi Espacio" />
    <link rel="apple-touch-icon" href="https://flaticon.com" />

    <title>Mi Agenda Personal</title>
    <!-- DNS Prefetching para acelerar la descarga de estilos externos -->
    <link rel="preconnect" href="https://jsdelivr.net" />
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />

    <!-- Tailwind CSS v4 Minificado -->
    <script
      src="https://jsdelivr.net/npm/@tailwindcss/browser@4"
      async
    ></script>

    <style>
      /* font-display: swap evita que el texto parpadee o tarde en aparecer al cargar */
      @import url("https://googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@500;700&display=swap&font-display=swap");

      body {
        font-family: "Quicksand", sans-serif;
      }
      .font-friendly-title {
        font-family: "Fredoka", sans-serif;
      }

      .bg-gradient-mesh {
        background-color: #f4f7fa;
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(14, 165, 233, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 0%,
            rgba(139, 92, 246, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 50% 100%,
            rgba(217, 70, 239, 0.12) 0px,
            transparent 50%
          );
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.53);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body
    class="bg-gradient-mesh text-slate-700 min-h-screen flex flex-col items-center justify-start antialiased selection:bg-indigo-100"
  >
    <div
      class="w-full max-w-md p-6 space-y-8 flex flex-col items-center justify-center text-center pb-28"
    >
      <!-- HEADER -->
      <header class="flex flex-col items-center space-y-2 pt-4">
        <div
          class="w-12 h-12 rounded-2xl border border-white/80 flex items-center justify-center bg-white/50 backdrop-blur-md shadow-md text-xl"
        >
          ✨
        </div>
        <div class="flex flex-col items-center">
          <h1
            class="text-3xl font-bold tracking-tight text-slate-900 font-friendly-title"
          >
            Mi Espacio
          </h1>
          <p
            class="text-[10px] font-extrabold text-indigo-600 uppercase tracking-widest mt-1 bg-indigo-50/60 px-3 py-0.5 rounded-full"
          >
            Agenda Privada
          </p>
        </div>
      </header>

      <div
        id="btn-permiso-alertas"
        onclick="solicitarPermisoNotificaciones()"
        class="w-full glass-panel rounded-2xl p-3.5 text-xs text-indigo-600 font-bold border border-indigo-100 cursor-pointer hover:bg-white/80 transition-all hidden"
      >
        🔔 Haz clic aquí para activar las alertas automáticas
      </div>

      <!-- VERSÍCULO -->
      <div
        class="w-full glass-panel rounded-3xl p-6 shadow-xl border border-white flex flex-col items-center justify-center"
      >
        <span
          class="text-[10px] font-extrabold text-indigo-600 uppercase tracking-widest bg-white/80 px-3 py-1 rounded-full shadow-2xs"
          >Palabra del Día</span
        >
        <p
          id="texto-versiculo"
          class="text-xl font-medium text-slate-800 mt-5 leading-relaxed font-friendly-title italic px-2"
        >
          Cargando...
        </p>
        <p
          id="cita-versiculo"
          class="text-xs font-bold tracking-widest text-slate-400 uppercase mt-3.5"
        ></p>
      </div>

      <!-- REUNIONES -->
      <div class="w-full space-y-3.5 flex flex-col items-center">
        <h2
          class="text-xs font-extrabold text-slate-400 uppercase tracking-widest"
        >
          📅 Reuniones de Hoy
        </h2>
        <div
          id="lista-reuniones"
          class="w-full space-y-3 flex flex-col items-center"
        ></div>
      </div>

      <!-- TAREAS -->
      <div class="w-full space-y-3.5 flex flex-col items-center">
        <h2
          class="text-xs font-extrabold text-slate-400 uppercase tracking-widest"
        >
          ✅ Tareas Pendientes
        </h2>
        <div
          id="lista-tareas"
          class="w-full glass-panel rounded-3xl p-5 shadow-lg space-y-4 flex flex-col items-stretch justify-center"
        ></div>
      </div>
    </div>

    <!-- BOTÓN ACCIÓN -->
    <div
      class="fixed bottom-6 inset-x-0 flex justify-center z-40 pointer-events-none"
    >
      <button
        onclick="toggleModal()"
        class="pointer-events-auto bg-gradient-to-tr from-indigo-600 to-violet-500 text-white p-4 rounded-2xl shadow-xl hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2 font-bold text-sm px-6"
      >
        <svg
          xmlns="http://w3.org"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 4v16m8-8H4"
          />
        </svg>
        <span>Nueva Actividad</span>
      </button>
    </div>

    <!-- MODAL -->
    <div
      id="modal-captura"
      class="fixed inset-0 bg-slate-900/30 backdrop-blur-xl hidden flex items-center justify-center p-4 z-50"
    >
      <div
        class="glass-panel rounded-3xl p-7 w-full max-w-sm space-y-5 shadow-2xl border border-white/80 flex flex-col items-center text-center"
      >
        <div class="space-y-1">
          <h3 class="text-2xl font-bold text-slate-900 font-friendly-title">
            Nueva Actividad
          </h3>
          <p
            class="text-[11px] font-bold text-slate-400 uppercase tracking-widest"
          >
            ¿Qué planeas organizar hoy?
          </p>
        </div>
        <input
          type="text"
          id="form-titulo"
          placeholder="Escribe tu pendiente aquí..."
          class="w-full p-3.5 bg-white/80 border border-slate-200 rounded-2xl text-sm font-semibold text-center outline-none"
        />
        <select
          id="form-tipo"
          class="w-full p-3.5 bg-white/80 border border-slate-200 rounded-2xl text-sm font-semibold text-center outline-none cursor-pointer"
        >
          <option value="tarea">📝 Es una Tarea</option>
          <option value="reunion">📅 Es una Reunión</option>
        </select>
        <div class="grid grid-cols-2 gap-3 w-full">
          <input
            type="date"
            id="form-fecha"
            class="p-3.5 bg-white/80 border border-slate-200 rounded-2xl text-sm font-semibold text-center outline-none"
          />
          <input
            type="time"
            id="form-hora"
            class="p-3.5 bg-white/80 border border-slate-200 rounded-2xl text-sm font-semibold text-center outline-none"
          />
        </div>
        <label
          class="flex items-center justify-center gap-3 p-3.5 text-xs font-bold text-slate-500 cursor-pointer select-none bg-white/50 border border-white/60 w-full rounded-2xl"
        >
          <input
            type="checkbox"
            id="form-alerta"
            checked
            class="rounded-md border-slate-300 text-indigo-600 w-4 h-4"
          />
          <span>🔔 Activar alerta en pantalla</span>
        </label>
        <div class="flex gap-3 w-full pt-1">
          <button
            onclick="toggleModal()"
            class="w-1/2 py-3.5 rounded-2xl text-xs font-bold text-slate-400 border border-slate-200/60 hover:bg-slate-100/60 transition-all"
          >
            Volver
          </button>
          <button
            onclick="guardarEvento()"
            class="w-1/2 py-3.5 bg-indigo-600 text-white rounded-2xl text-xs font-bold shadow-md hover:bg-indigo-700 transition-all"
          >
            ¡Listo!
          </button>
        </div>
      </div>
    </div>

    <!-- Carga diferida y asíncrona de la lógica -->
    <script src="app.js" defer></script>
  </body>
</html>
